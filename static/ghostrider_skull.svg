<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="100%" height="100%">
  <defs>
    <!-- Fire Gradients -->
    <linearGradient id="grOuterFire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="grMidFire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="90%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="grBone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <radialGradient id="grEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0" />
    </radialGradient>

    <!-- Fiery Heat Blur & Glow Filters -->
    <filter id="grGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="grEyeFire" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .gr-flame-back {
      transform-origin: 60px 100px;
      animation: flameSwayBack 1.8s ease-in-out infinite alternate;
      filter: url(#grGlow);
    }
    .gr-flame-mid {
      transform-origin: 60px 95px;
      animation: flameSwayMid 1.2s ease-in-out infinite alternate;
    }
    .gr-flame-core {
      transform-origin: 60px 85px;
      animation: flameSwayCore 0.8s ease-in-out infinite alternate;
    }
    .gr-sparks {
      animation: sparkRise 1.4s ease-out infinite;
    }
    .gr-eye-pupil {
      animation: eyeFlicker 0.6s infinite alternate;
      transform-origin: center;
    }
    .gr-skull-body {
      filter: drop-shadow(0 0 8px rgba(234, 88, 12, 0.7));
      animation: skullHover 2.5s ease-in-out infinite alternate;
      transform-origin: 60px 75px;
    }

    @keyframes flameSwayBack {
      0% { transform: scale(1) rotate(-3deg) skewX(-2deg); opacity: 0.9; }
      50% { transform: scale(1.06, 1.1) rotate(2deg) skewX(3deg); opacity: 1; }
      100% { transform: scale(0.96, 1.04) rotate(-2deg) skewX(-1deg); opacity: 0.85; }
    }
    @keyframes flameSwayMid {
      0% { transform: scale(1) rotate(3deg) skewX(3deg); }
      50% { transform: scale(1.04, 1.08) rotate(-2deg) skewX(-2deg); }
      100% { transform: scale(0.98, 1.02) rotate(2deg) skewX(2deg); }
    }
    @keyframes flameSwayCore {
      0% { transform: scale(0.98, 1) rotate(-2deg); }
      50% { transform: scale(1.05, 1.07) rotate(2deg); }
      100% { transform: scale(1, 1.02) rotate(-1deg); }
    }
    @keyframes eyeFlicker {
      0% { opacity: 0.8; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.85; transform: scale(1); }
    }
    @keyframes skullHover {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-3px) rotate(1deg); }
    }
    @keyframes sparkRise {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      40% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-28px) scale(1.3); }
    }
  </style>

  <!-- BACKGROUND FLAMES (ROARING GHOST RIDER INFERNO) -->
  <g class="gr-flame-back">
    <!-- Huge background crimson/orange fire plumes -->
    <path d="M 60 5
             C 45 18, 30 15, 22 35
             C 14 50, 10 70, 16 90
             C 20 102, 35 116, 60 118
             C 85 116, 100 102, 104 90
             C 110 70, 106 50, 98 35
             C 90 15, 75 18, 60 5 Z"
          fill="url(#grOuterFire)" />
    <!-- Additional outer flame tendrils -->
    <path d="M 28 45 C 15 32, 18 18, 25 10 C 27 22, 35 30, 38 42 Z" fill="#ea580c" />
    <path d="M 92 45 C 105 32, 102 18, 95 10 C 93 22, 85 30, 82 42 Z" fill="#ea580c" />
    <path d="M 60 2 C 55 12, 48 18, 48 26 C 54 22, 58 16, 60 2 Z" fill="#f59e0b" />
  </g>

  <g class="gr-flame-mid">
    <!-- Mid-layer intense orange/yellow flame tongues -->
    <path d="M 60 12
             C 48 25, 36 28, 30 45
             C 24 58, 22 75, 28 92
             C 34 104, 46 112, 60 114
             C 74 112, 86 104, 92 92
             C 98 75, 96 58, 90 45
             C 84 28, 72 25, 60 12 Z"
          fill="url(#grMidFire)" />
    <!-- Rising central flame crest -->
    <path d="M 60 8 C 52 20, 44 24, 44 36 C 52 30, 56 22, 60 8 Z" fill="#fef08a" />
    <path d="M 60 8 C 68 20, 76 24, 76 36 C 68 30, 64 22, 60 8 Z" fill="#fef08a" />
  </g>

  <g class="gr-flame-core">
    <!-- Blazing white-hot core behind skull -->
    <path d="M 60 20
             C 50 32, 42 40, 38 55
             C 34 68, 36 82, 42 94
             C 48 102, 54 106, 60 108
             C 66 106, 72 102, 78 94
             C 84 82, 86 68, 82 55
             C 78 40, 70 32, 60 20 Z"
          fill="#ffffff" opacity="0.85" filter="url(#grGlow)" />
  </g>

  <!-- SPARKS / EMBERS RISING -->
  <g class="gr-sparks">
    <circle cx="45" cy="22" r="1.8" fill="#fef08a" />
    <circle cx="75" cy="18" r="1.5" fill="#fef08a" />
    <circle cx="35" cy="35" r="1.4" fill="#f59e0b" />
    <circle cx="85" cy="30" r="1.6" fill="#f59e0b" />
    <circle cx="60" cy="6" r="2.0" fill="#ffffff" />
    <circle cx="52" cy="14" r="1.2" fill="#fef08a" />
    <circle cx="68" cy="12" r="1.3" fill="#fef08a" />
  </g>

  <!-- GHOST RIDER DEMONIC SKULL -->
  <g class="gr-skull-body">
    <!-- Cranium Base -->
    <path d="M 60 38
             C 42 38, 32 48, 32 64
             C 32 74, 36 81, 41 86
             C 42 88, 44 91, 45 96
             C 46 100, 48 103, 52 104
             L 68 104
             C 72 103, 74 100, 75 96
             C 76 91, 78 88, 79 86
             C 84 81, 88 74, 88 64
             C 88 48, 78 38, 60 38 Z"
          fill="url(#grBone)"
          stroke="#1e293b"
          stroke-width="1.8"
          stroke-linejoin="round" />

    <!-- Cranium Bone Cracks & Brow Shading -->
    <path d="M 60 40 L 60 52 L 56 57 L 57 62" stroke="#475569" stroke-width="0.9" fill="none" opacity="0.7" />
    <path d="M 60 52 L 63 56" stroke="#475569" stroke-width="0.8" fill="none" opacity="0.6" />
    <path d="M 44 48 L 48 53" stroke="#64748b" stroke-width="0.7" fill="none" opacity="0.5" />
    <path d="M 76 48 L 72 53" stroke="#64748b" stroke-width="0.7" fill="none" opacity="0.5" />

    <!-- Menacing Fierce Brow Ridge (Angry V-Shape) -->
    <path d="M 36 60 Q 48 64 57 67 Q 60 67 63 67 Q 72 64 84 60"
          stroke="#0f172a"
          stroke-width="2.5"
          fill="none"
          stroke-linecap="round" />

    <!-- LEFT EYE SOCKET (Fiery Burning Chasm) -->
    <path d="M 40 66
             C 46 64, 53 67, 54 73
             C 54 78, 49 84, 43 83
             C 37 82, 36 73, 40 66 Z"
          fill="#09050d"
          stroke="#1e1528"
          stroke-width="1.2" />
    <!-- Left Eye Fire Glow & Pupil -->
    <ellipse cx="46" cy="74" rx="6" ry="5.5" fill="url(#grEyeGlow)" filter="url(#grEyeFire)" />
    <circle class="gr-eye-pupil" cx="46" cy="74" r="2.2" fill="#ffffff" />

    <!-- RIGHT EYE SOCKET (Fiery Burning Chasm) -->
    <path d="M 80 66
             C 74 64, 67 67, 66 73
             C 66 78, 71 84, 77 83
             C 83 82, 84 73, 80 66 Z"
          fill="#09050d"
          stroke="#1e1528"
          stroke-width="1.2" />
    <!-- Right Eye Fire Glow & Pupil -->
    <ellipse cx="74" cy="74" rx="6" ry="5.5" fill="url(#grEyeGlow)" filter="url(#grEyeFire)" />
    <circle class="gr-eye-pupil" cx="74" cy="74" r="2.2" fill="#ffffff" />

    <!-- Triangular Nasal Cavity -->
    <path d="M 60 76 L 56 86 L 60 84 L 64 86 Z" fill="#09050d" />

    <!-- Cheekbone Shadows -->
    <path d="M 34 76 Q 38 82 42 85" stroke="#334155" stroke-width="1.2" fill="none" />
    <path d="M 86 76 Q 82 82 78 85" stroke="#334155" stroke-width="1.2" fill="none" />

    <!-- Sinister Grinning Teeth & Jaw -->
    <!-- Upper Maxilla -->
    <path d="M 46 92 L 74 92" stroke="#0f172a" stroke-width="1.5" />
    <!-- Tooth Separators -->
    <line x1="49" y1="89" x2="49" y2="95" stroke="#0f172a" stroke-width="1.2" />
    <line x1="53" y1="89" x2="53" y2="96" stroke="#0f172a" stroke-width="1.2" />
    <line x1="57" y1="89" x2="57" y2="96" stroke="#0f172a" stroke-width="1.2" />
    <line x1="60" y1="89" x2="60" y2="96" stroke="#0f172a" stroke-width="1.4" />
    <line x1="63" y1="89" x2="63" y2="96" stroke="#0f172a" stroke-width="1.2" />
    <line x1="67" y1="89" x2="67" y2="96" stroke="#0f172a" stroke-width="1.2" />
    <line x1="71" y1="89" x2="71" y2="95" stroke="#0f172a" stroke-width="1.2" />

    <!-- Mandible Jawline -->
    <path d="M 48 97 L 72 97 L 69 104 L 51 104 Z"
          fill="#cbd5e1"
          stroke="#0f172a"
          stroke-width="1.2" />
    <line x1="53" y1="97" x2="53" y2="102" stroke="#0f172a" stroke-width="1.1" />
    <line x1="57" y1="97" x2="57" y2="103" stroke="#0f172a" stroke-width="1.1" />
    <line x1="60" y1="97" x2="60" y2="103" stroke="#0f172a" stroke-width="1.2" />
    <line x1="63" y1="97" x2="63" y2="103" stroke="#0f172a" stroke-width="1.1" />
    <line x1="67" y1="97" x2="67" y2="102" stroke="#0f172a" stroke-width="1.1" />
  </g>
</svg>
